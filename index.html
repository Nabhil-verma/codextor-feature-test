<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Codexter — free, interactive coding lessons</title>
    <meta
      name="description"
      content="A 100% free code teacher. Interactive lessons, a live playground, and quizzes — create an account to keep your progress across devices."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://nnghedico.freebuff.app/" />
    <meta name="theme-color" content="#d4af37" />
    <!-- Night mode paints a near-black shell, so the browser chrome follows it. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0c" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Codexter" />
    <meta property="og:title" content="Codexter — free, interactive coding lessons" />
    <meta
      property="og:description"
      content="Write and run real code from minute one: 15 tracks, 86 hands-on lessons, a live playground and quizzes. Free forever."
    />
    <meta property="og:url" content="https://nnghedico.freebuff.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Codexter — free, interactive coding lessons" />
    <meta
      name="twitter:description"
      content="Write and run real code from minute one: 15 tracks, 86 hands-on lessons, a live playground and quizzes. Free forever."
    />
    <script>
      // Apply the saved (or OS) theme before first paint so night mode never
      // flashes a white page. Mirrors src/lib/theme.ts.
      (function () {
        try {
          var saved = localStorage.getItem("codexter-theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
